<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Keystart Auto Locksmiths</title>
<script>
  // ============================================================
  // DYNAMIC QR REDIRECT
  //  - Change BASE below to re-target EVERY printed QR at once
  //    (no reprints needed).
  //  - Source tracking: add ?src=flyer / ?src=card etc. to the
  //    QR's URL. It is passed through to the links page so each
  //    printed item is tracked separately. Defaults to "qr".
  // ============================================================
  var BASE = "https://go.keystartautolocksmiths.co.uk/links.html";
  var src = (new URLSearchParams(location.search)).get("src") || "qr";
  location.replace(BASE + "?src=" + encodeURIComponent(src));
</script>
<meta http-equiv="refresh" content="0;url=https://go.keystartautolocksmiths.co.uk/links.html?src=qr">
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#0E1F3A">
  Taking you to Keystart Auto Locksmiths…
</body>
</html>
